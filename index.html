<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Stunt Driving & Car Customizer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #111; color: #fff; }
        #canvas-container { width: 100%; height: 100vh; display: block; }
        
        /* UI Overlay */
        #hud {
            position: absolute; top: 20px; left: 20px; pointer-events: none;
            display: flex; flex-direction: column; gap: 8px; z-index: 10;
        }
        .hud-card {
            background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(8px);
            padding: 12px 20px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.15);
            font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
        }
        #speedometer { font-size: 24px; color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.5); }
        
        /* Garage / Customizer UI */
        #garage-btn {
            position: absolute; top: 20px; right: 20px; z-index: 20;
            padding: 12px 24px; background: linear-gradient(135deg, #ff0055, #ff5500);
            border: none; color: #fff; border-radius: 30px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4); transition: transform 0.2s, box-shadow 0.2s;
        }
        #garage-btn:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(255, 0, 85, 0.6); }

        #garage-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 15, 25, 0.95); backdrop-filter: blur(12px);
            display: none; flex-direction: row; z-index: 30;
        }
        
        .garage-sidebar {
            width: 320px; height: 100%; background: rgba(0, 0, 0, 0.5);
            border-right: 1px solid rgba(255, 255, 255, 0.1); padding: 20px;
            overflow-y: auto; display: flex; flex-direction: column; gap: 15px;
        }
        
        .garage-sidebar::-webkit-scrollbar { width: 6px; }
        .garage-sidebar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 3px; }

        .garage-main { flex: 1; height: 100%; position: relative; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }

        h2, h3 { color: #fff; margin-bottom: 8px; font-size: 18px; letter-spacing: 1px; text-transform: uppercase; border-bottom: 2px solid #ff0055; padding-bottom: 4px; }
        
        .car-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        .car-card {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px; border-radius: 6px; text-align: center; cursor: pointer; transition: all 0.2s;
            font-size: 12px; font-weight: bold;
        }
        .car-card:hover, .car-card.active { background: #ff0055; border-color: #ff0055; color: #fff; }
        .car-card span { display: block; font-size: 10px; opacity: 0.7; font-weight: normal; margin-top: 2px; }

        .control-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        .control-group label { font-size: 12px; color: #aaa; text-transform: uppercase; }
        .control-group input[type="color"] { width: 100%; height: 35px; border: none; border-radius: 4px; cursor: pointer; background: transparent; }
        .control-group select, .control-group input[type="range"] {
            width: 100%; padding: 8px; background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 4px; color: #fff; outline: none;
        }

        .garage-actions { display: flex; justify-content: flex-end; gap: 15px; }
        .btn {
            padding: 12px 30px; border: none; border-radius: 25px; font-weight: bold;
            cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s;
        }
        .btn-primary { background: #00ffcc; color: #000; box-shadow: 0 0 15px rgba(0,255,204,0.4); }
        .btn-primary:hover { background: #00cca3; }

        #controls-hint {
            position: absolute; bottom: 20px; left: 20px; pointer-events: none;
            background: rgba(0, 0, 0, 0.6); padding: 12px 20px; border-radius: 8px; font-size: 12px; color: #ccc;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="hud">
        <div class="hud-card" id="speedometer">0 MPH</div>
        <div class="hud-card" id="car-name-display">Vehicle: Supercar Alpha</div>
    </div>

    <button id="garage-btn" onclick="openGarage()">🏎️ Custom Garage</button>

    <div id="controls-hint">
        <strong>Controls:</strong> W / Up Arrow = Accelerate | S / Down Arrow = Reverse | A/D = Steer | Space = Brake | R = Reset Car
    </div>

    <!-- Garage Overlay -->
    <div id="garage-modal">
        <div class="garage-sidebar">
            <h2>Select Vehicle (30 Unlocked)</h2>
            <div class="car-grid" id="car-list"></div>

            <h2>Customization</h2>
            
            <div class="control-group">
                <label>Body Paint Color</label>
                <input type="color" id="paintColor" value="#ff0033" onchange="updateCarCustoms()">
            </div>

            <div class="control-group">
                <label>Paint Finish</label>
                <select id="paintFinish" onchange="updateCarCustoms()">
                    <option value="gloss">Glossy / Metallic</option>
                    <option value="matte">Matte</option>
                    <option value="chrome">Chrome / Reflective</option>
                </select>
            </div>

            <div class="control-group">
                <label>Rim Style</label>
                <select id="rimStyle" onchange="updateCarCustoms()">
                    <option value="5spoke">5-Spoke Sport</option>
                    <option value="dish">Deep Dish Muscle</option>
                    <option value="offroad">Off-Road Heavy</option>
                </select>
            </div>

            <div class="control-group">
                <label>Rim Color</label>
                <input type="color" id="rimColor" value="#cccccc" onchange="updateCarCustoms()">
            </div>

            <div class="control-group">
                <label>Window Tint</label>
                <input type="range" id="windowTint" min="0.1" max="0.9" step="0.1" value="0.7" onchange="updateCarCustoms()">
            </div>

            <div class="control-group">
                <label>Spoiler / Wing</label>
                <select id="spoilerType" onchange="updateCarCustoms()">
                    <option value="none">None</option>
                    <option value="sport">GT Sport Wing</option>
                    <option value="drag">Big Drag Spoiler</option>
                </select>
            </div>

            <div class="control-group">
                <label>Suspension Height</label>
                <input type="range" id="suspensionHeight" min="0.5" max="2.0" step="0.1" value="1.0" onchange="updateCarCustoms()">
            </div>
        </div>

        <div class="garage-main">
            <div></div>
            <div class="garage-actions">
                <button class="btn btn-primary" onclick="closeGarage()">Save & Drive</button>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        // ---------------------------------------------------------------
        // 30 CAR ROSTER GENERATION
        // ---------------------------------------------------------------
        const CAR_TYPES = ["Supercar", "Muscle", "Offroad", "Truck", "Hypercar", "Tuner"];
        const CAR_DATABASE = [];

        for (let i = 1; i <= 30; i++) {
            const category = CAR_TYPES[(i - 1) % CAR_TYPES.length];
            CAR_DATABASE.push({
                id: i,
                name: `${category} v${i}`,
                category: category,
                speedMax: 0.8 + (i * 0.015),
                accel: 0.015 + (i * 0.0005),
                color: `#${Math.floor(Math.random()*16777215).toString(16).padStart(6, '0')}`,
                rimColor: '#dddddd',
                finish: 'gloss',
                rimStyle: '5spoke',
                spoiler: i % 2 === 0 ? 'sport' : 'none',
                tint: 0.7,
                height: 1.0
            });
        }

        let currentCarIndex = 0;
        let activeCarData = Object.assign({}, CAR_DATABASE[0]);

        // ---------------------------------------------------------------
        // THREE.JS SETUP & WORLD INITIALIZATION
        // ---------------------------------------------------------------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.002);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(100, 300, 100);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 1000;
        const d = 200;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        // Ground Mesh
        const groundGeo = new THREE.PlaneGeometry(3000, 3000);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x2e8b57, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Grid Floor helper for styling
        const grid = new THREE.GridHelper(3000, 100, 0x000000, 0x000000);
        grid.position.y = 0.05;
        grid.material.opacity = 0.15;
        grid.material.transparent = true;
        scene.add(grid);

        // ---------------------------------------------------------------
        // TRACK & LOOP-DE-LOOP BUILDING
        // ---------------------------------------------------------------
        function buildTrackAndStunts() {
            // Main Road
            const roadGeo = new THREE.BoxGeometry(40, 0.2, 800);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.position.set(0, 0.1, -300);
            road.receiveShadow = true;
            scene.add(road);

            // True Vertical 3D Loop-de-Loop Curve
            const loopRadius = 35;
            const loopSegments = 60;
            const loopGroup = new THREE.Group();
            loopGroup.position.set(0, 0, -500);

            for (let i = 0; i < loopSegments; i++) {
                const angle1 = (i / loopSegments) * Math.PI * 2;
                const angle2 = ((i + 1) / loopSegments) * Math.PI * 2;

                const z1 = -Math.sin(angle1) * loopRadius;
                const y1 = loopRadius - Math.cos(angle1) * loopRadius;

                const z2 = -Math.sin(angle2) * loopRadius;
                const y2 = loopRadius - Math.cos(angle2) * loopRadius;

                const dx = 0;
                const dy = y2 - y1;
                const dz = z2 - z1;
                const length = Math.sqrt(dy * dy + dz * dz);

                const segGeo = new THREE.BoxGeometry(38, 0.8, length + 0.5);
                const segMat = new THREE.MeshStandardMaterial({ 
                    color: i % 2 === 0 ? 0xff0055 : 0x333333,
                    roughness: 0.3 
                });
                const seg = new THREE.Mesh(segGeo, segMat);

                seg.position.set(0, (y1 + y2) / 2, (z1 + z2) / 2);
                seg.rotation.x = Math.atan2(dy, -dz);
                seg.receiveShadow = true;
                seg.castShadow = true;
                loopGroup.add(seg);
            }
            scene.add(loopGroup);

            // Large Stunt Jump Ramp
            const rampGeo = new THREE.BoxGeometry(30, 1, 40);
            const rampMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, roughness: 0.4 });
            const ramp = new THREE.Mesh(rampGeo, rampMat);
            ramp.position.set(0, 5, -100);
            ramp.rotation.x = Math.PI / 10;
            ramp.receiveShadow = true;
            ramp.castShadow = true;
            scene.add(ramp);
        }
        buildTrackAndStunts();

        // ---------------------------------------------------------------
        // CAR PROCEDURAL GEOMETRY BUILDER
        // ---------------------------------------------------------------
        let carGroup = new THREE.Group();
        scene.add(carGroup);

        let bodyMesh, cabinMesh, spoilerMesh;
        let wheelMeshes = [];

        function createCarMesh(data) {
            // Clear previous car
            while (carGroup.children.length > 0) {
                carGroup.remove(carGroup.children[0]);
            }
            wheelMeshes = [];

            // Body Material
            let roughness = 0.3, metalness = 0.5;
            if (data.finish === 'matte') { roughness = 0.9; metalness = 0.1; }
            if (data.finish === 'chrome') { roughness = 0.05; metalness = 0.95; }

            const bodyMat = new THREE.MeshStandardMaterial({
                color: new THREE.Color(data.color),
                roughness: roughness,
                metalness: metalness
            });

            // Glass Material
            const glassMat = new THREE.MeshStandardMaterial({
                color: 0x111111,
                roughness: 0.1,
                metalness: 0.9,
                transparent: true,
                opacity: parseFloat(data.tint)
            });

            // Rim Material
            const rimMat = new THREE.MeshStandardMaterial({
                color: new THREE.Color(data.rimColor),
                roughness: 0.2,
                metalness: 0.8
            });

            const tireMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.8 });

            // Base dimensions adjusted by category
            let bodyW = 2.4, bodyH = 0.9, bodyL = 4.8;
            let cabinW = 2.0, cabinH = 0.7, cabinL = 2.4;

            if (data.category === 'Truck' || data.category === 'Offroad') {
                bodyW = 2.6; bodyH = 1.2; bodyL = 5.2;
                cabinW = 2.4; cabinH = 0.9; cabinL = 2.2;
            } else if (data.category === 'Supercar' || data.category === 'Hypercar') {
                bodyW = 2.5; bodyH = 0.7; bodyL = 4.6;
                cabinW = 1.8; cabinH = 0.6; cabinL = 2.2;
            }

            // Chassis Main Body
            const bodyGeo = new THREE.BoxGeometry(bodyW, bodyH, bodyL);
            bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
            bodyMesh.position.y = bodyH / 2 + 0.4;
            bodyMesh.castShadow = true;
            bodyMesh.receiveShadow = true;
            carGroup.add(bodyMesh);

            // Cabin / Windows
            const cabinGeo = new THREE.BoxGeometry(cabinW, cabinH, cabinL);
            cabinMesh = new THREE.Mesh(cabinGeo, glassMat);
            cabinMesh.position.set(0, bodyMesh.position.y + bodyH / 2 + cabinH / 2 - 0.1, -0.2);
            cabinMesh.castShadow = true;
            carGroup.add(cabinMesh);

            // Wheels
            const wheelRadius = (data.category === 'Offroad' || data.category === 'Truck') ? 0.6 : 0.45;
            const wheelWidth = 0.35;
            const wheelGeo = new THREE.CylinderGeometry(wheelRadius, wheelRadius, wheelWidth, 24);
            const rimGeo = new THREE.CylinderGeometry(wheelRadius * 0.6, wheelRadius * 0.6, wheelWidth + 0.02, 12);

            const wheelPositions = [
                { x: -bodyW/2 - 0.1, y: wheelRadius, z:  bodyL/3 }, // Front Left
                { x:  bodyW/2 + 0.1, y: wheelRadius, z:  bodyL/3 }, // Front Right
                { x: -bodyW/2 - 0.1, y: wheelRadius, z: -bodyL/3 }, // Rear Left
                { x:  bodyW/2 + 0.1, y: wheelRadius, z: -bodyL/3 }  // Rear Right
            ];

            wheelPositions.forEach(pos => {
                const wheelContainer = new THREE.Group();
                
                const tire = new THREE.Mesh(wheelGeo, tireMat);
                tire.rotation.z = Math.PI / 2;
                tire.castShadow = true;
                wheelContainer.add(tire);

                const rim = new THREE.Mesh(rimGeo, rimMat);
                rim.rotation.z = Math.PI / 2;
                wheelContainer.add(rim);

                wheelContainer.position.set(pos.x, pos.y * data.height, pos.z);
                carGroup.add(wheelContainer);
                wheelMeshes.push(wheelContainer);
            });

            // Spoiler
            if (data.spoiler !== 'none') {
                const spWidth = data.spoiler === 'drag' ? 2.8 : 2.2;
                const spGeo = new THREE.BoxGeometry(spWidth, 0.1, 0.6);
                spoilerMesh = new THREE.Mesh(spGeo, bodyMat);
                
                const strutGeo = new THREE.BoxGeometry(0.1, 0.5, 0.1);
                const strut1 = new THREE.Mesh(strutGeo, bodyMat);
                const strut2 = new THREE.Mesh(strutGeo, bodyMat);
                
                strut1.position.set(-0.6, -0.25, 0);
                strut2.position.set( 0.6, -0.25, 0);
                
                spoilerMesh.add(strut1);
                spoilerMesh.add(strut2);

                spoilerMesh.position.set(0, bodyMesh.position.y + bodyH / 2 + 0.5, -bodyL / 2 + 0.3);
                carGroup.add(spoilerMesh);
            }
        }

        // ---------------------------------------------------------------
        // VEHICLE PHYSICS & CONTROLS
        // ---------------------------------------------------------------
        let carPos = new THREE.Vector3(0, 0.5, 0);
        let carRot = new THREE.Euler(0, 0, 0, 'YXZ');
        let carQuaternion = new THREE.Quaternion();
        
        let speed = 0;
        let steeringAngle = 0;

        const keys = { w: false, s: false, a: false, d: false, space: false };

        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'ArrowUp') keys.w = true;
            if (e.key === 's' || e.key === 'ArrowDown') keys.s = true;
            if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = true;
            if (e.key === 'd' || e.key === 'ArrowRight') keys.d = true;
            if (e.key === ' ') keys.space = true;
            if (e.key === 'r' || e.key === 'R') resetCarPosition();
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'ArrowUp') keys.w = false;
            if (e.key === 's' || e.key === 'ArrowDown') keys.s = false;
            if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = false;
            if (e.key === 'd' || e.key === 'ArrowRight') keys.d = false;
            if (e.key === ' ') keys.space = false;
        });

        function resetCarPosition() {
            carPos.set(0, 0.5, 0);
            carRot.set(0, 0, 0);
            carQuaternion.identity();
            speed = 0;
            carGroup.position.copy(carPos);
            carGroup.quaternion.copy(carQuaternion);
        }

        function updatePhysics() {
            if (inGarage) return;

            // Acceleration & Braking
            if (keys.w) {
                speed += activeCarData.accel;
                if (speed > activeCarData.speedMax) speed = activeCarData.speedMax;
            } else if (keys.s) {
                speed -= activeCarData.accel * 0.6;
                if (speed < -activeCarData.speedMax * 0.4) speed = -activeCarData.speedMax * 0.4;
            } else {
                speed *= 0.98; // Friction
            }

            if (keys.space) {
                speed *= 0.92; // Handbrake
            }

            // Steering
            const maxSteer = 0.04;
            if (keys.a) steeringAngle = Math.min(steeringAngle + 0.005, maxSteer);
            else if (keys.d) steeringAngle = Math.max(steeringAngle - 0.005, -maxSteer);
            else steeringAngle *= 0.8;

            // Apply turn relative to velocity
            if (Math.abs(speed) > 0.001) {
                const turnFactor = speed > 0 ? 1 : -1;
                carRot.y += steeringAngle * turnFactor * (speed / activeCarData.speedMax);
            }

            // Orientation and Movement Vectors
            carQuaternion.setFromEuler(carRot);
            const forwardVector = new THREE.Vector3(0, 0, -1).applyQuaternion(carQuaternion);

            // Loop-de-Loop Physics Handling
            const loopZ = -500;
            const loopRadius = 35;
            const distToLoopCenter = Math.hypot(carPos.x, carPos.z - loopZ);

            if (distToLoopCenter < 20 && carPos.z < -450 && carPos.z > -550) {
                // Inside Loop zone: pitch car around loop curvature
                const relZ = carPos.z - loopZ;
                const angleOnLoop = Math.atan2(carPos.y - loopRadius, -relZ);
                
                // Keep pitch synchronized to loop geometry
                carRot.x = angleOnLoop;
            } else {
                // Standard flat terrain gravity & slope recovery
                carRot.x *= 0.9;
                carRot.z *= 0.9;
                carPos.y = 0.5;
            }

            // Apply displacement
            carPos.addScaledVector(forwardVector, speed);

            // Update Mesh position/rotation
            carGroup.position.copy(carPos);
            carGroup.quaternion.copy(carQuaternion);

            // Spin wheels based on speed
            wheelMeshes.forEach(w => {
                w.children[0].rotation.x += speed * 2;
            });

            // Update HUD
            const speedMph = Math.round(Math.abs(speed) * 160);
            document.getElementById('speedometer').innerText = `${speedMph} MPH`;
        }

        // ---------------------------------------------------------------
        // CAMERA CONTROLLER
        // ---------------------------------------------------------------
        function updateCamera() {
            if (inGarage) {
                // Smooth orbiting camera in garage mode
                const time = Date.now() * 0.0008;
                camera.position.x = carGroup.position.x + Math.sin(time) * 9;
                camera.position.z = carGroup.position.z + Math.cos(time) * 9;
                camera.position.y = carGroup.position.y + 3;
                camera.lookAt(carGroup.position.clone().add(new THREE.Vector3(0, 0.8, 0)));
            } else {
                // Dynamic chase camera during gameplay
                const offset = new THREE.Vector3(0, 3.5, 9).applyQuaternion(carGroup.quaternion);
                const targetCamPos = carGroup.position.clone().add(offset);
                camera.position.lerp(targetCamPos, 0.1);

                const lookTarget = carGroup.position.clone().add(new THREE.Vector3(0, 1.2, -2).applyQuaternion(carGroup.quaternion));
                camera.lookAt(lookTarget);
            }
        }

        // ---------------------------------------------------------------
        // GARAGE & CUSTOMIZATION LOGIC
        // ---------------------------------------------------------------
        let inGarage = false;

        function populateCarList() {
            const listContainer = document.getElementById('car-list');
            listContainer.innerHTML = '';

            CAR_DATABASE.forEach((car, idx) => {
                const card = document.createElement('div');
                card.className = `car-card ${idx === currentCarIndex ? 'active' : ''}`;
                card.onclick = () => selectCar(idx);
                card.innerHTML = `
                    ${car.name}
                    <span>${car.category}</span>
                `;
                listContainer.appendChild(card);
            });
        }

        function selectCar(index) {
            currentCarIndex = index;
            activeCarData = Object.assign({}, CAR_DATABASE[index]);

            // Sync UI Inputs
            document.getElementById('paintColor').value = activeCarData.color;
            document.getElementById('rimColor').value = activeCarData.rimColor;
            document.getElementById('paintFinish').value = activeCarData.finish;
            document.getElementById('rimStyle').value = activeCarData.rimStyle;
            document.getElementById('spoilerType').value = activeCarData.spoiler;
            document.getElementById('windowTint').value = activeCarData.tint;
            document.getElementById('suspensionHeight').value = activeCarData.height;

            populateCarList();
            createCarMesh(activeCarData);
            document.getElementById('car-name-display').innerText = `Vehicle: ${activeCarData.name}`;
        }

        function updateCarCustoms() {
            activeCarData.color = document.getElementById('paintColor').value;
            activeCarData.rimColor = document.getElementById('rimColor').value;
            activeCarData.finish = document.getElementById('paintFinish').value;
            activeCarData.rimStyle = document.getElementById('rimStyle').value;
            activeCarData.spoiler = document.getElementById('spoilerType').value;
            activeCarData.tint = document.getElementById('windowTint').value;
            activeCarData.height = parseFloat(document.getElementById('suspensionHeight').value);

            // Update master DB record
            CAR_DATABASE[currentCarIndex] = Object.assign({}, activeCarData);

            // Rebuild model with updated specs
            createCarMesh(activeCarData);
        }

        function openGarage() {
            inGarage = true;
            document.getElementById('garage-modal').style.display = 'flex';
            document.getElementById('hud').style.display = 'none';
            document.getElementById('controls-hint').style.display = 'none';
            document.getElementById('garage-btn').style.display = 'none';
            populateCarList();
        }

        function closeGarage() {
            inGarage = false;
            document.getElementById('garage-modal').style.display = 'none';
            document.getElementById('hud').style.display = 'flex';
            document.getElementById('controls-hint').style.display = 'block';
            document.getElementById('garage-btn').style.display = 'block';
            resetCarPosition();
        }

        // Initialize Garage list and starting mesh
        createCarMesh(activeCarData);

        // ---------------------------------------------------------------
        // MAIN GAME LOOP & RESIZE HANDLER
        // ---------------------------------------------------------------
        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();
            updateCamera();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', ()annotation => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start render loop
        animate();
    </script>
</body>
</html>
