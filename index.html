<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redline Retro - Sky Ride</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #120428;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        .hud-top {
            display: flex;
            justify-content: space-between;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px #ff00de, 0 0 20px #ff00de;
        }
        .hud-center {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #00ffff;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 0 0 15px #00ffff;
            display: none;
        }
        .controls-bottom {
            display: flex;
            justify-content: space-around;
            align-items: center;
            pointer-events: auto;
            margin-bottom: 20px;
        }
        .btn-control {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 3px solid white;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255,255,255,0.4);
        }
        .btn-nitro {
            width: 100px;
            height: 100px;
            background: rgba(255, 0, 85, 0.6);
            border-color: #ff0055;
            box-shadow: 0 0 20px #ff0055;
        }
    </style>
    <!-- Include Three.js via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-container">
        <div class="hud-top">
            <div id="speed-display">70 km/h</div>
            <div id="distance-display">0 m</div>
            <div id="orb-display">💎 0</div>
        </div>

        <div id="hud-announcement" class="hud-center">RAMP!</div>

        <div class="controls-bottom">
            <div class="btn-control" id="btn-left">◀</div>
            <div class="btn-control" id="btn-right">▶</div>
            <div class="btn-control" id="btn-front">Flip</div>
            <div class="btn-control btn-nitro" id="btn-nitro">NITRO</div>
        </div>
    </div>

    <script>
        let scene, camera, renderer;
        let car, wingsMesh;
        let road, buildings = [];
        let speed = 70;
        let baseSpeed = 70;
        let distance = 0;
        let orbs = 0;
        let isNitro = false;
        let isAirborne = false;
        let isFlyingMode = false;
        let verticalVelocity = 0;
        let carRotationX = 0;
        
        let moveLeft = false;
        let moveRight = false;
        const laneWidth = 3;
        let targetLaneX = 0;

        // Web Audio Context & Synthesizer State
        let audioCtx = null;
        let musicInterval = null;

        init();
        animate();

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                startSynthwaveMusic();
            }
        }

        // Procedural Synthwave Background Music Loop
        function startSynthwaveMusic() {
            const bassNotes = [110, 110, 92.5, 92.5, 82.4, 82.4, 98, 98]; // A2, F#2, E2, G2
            let step = 0;

            musicInterval = setInterval(() => {
                if (!audioCtx) return;
                
                // Bass pulse
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(bassNotes[step % bassNotes.length], audioCtx.currentTime);
                
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);

                step++;
            }, 250); // 120 BPM driving beat
        }

        // Sound Effect Generator for Nitro, Ramps, and Orbs
        function playSound(type) {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            let now = audioCtx.currentTime;

            if (type === 'nitro') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(80, now);
                osc.frequency.linearRampToValueAtTime(40, now + 0.4);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'ramp') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.5);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'orb') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, now); // D5
                osc.frequency.setValueAtTime(880, now + 0.08); // A5
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        function init() {
            // Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x120428);
            scene.fog = new THREE.FogExp2(0x120428, 0.015);

            // Camera Setup
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4, -8);
            camera.lookAt(0, 1, 5);

            // Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Lighting
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const sunLight = new THREE.DirectionalLight(0xff00de, 0.8);
            sunLight.position.set(0, 20, -30);
            scene.add(sunLight);

            // Sunset Sun
            const sun = new THREE.Mesh(new THREE.CircleGeometry(25, 32), new THREE.MeshBasicMaterial({ color: 0xff5500 }));
            sun.position.set(0, 15, -200);
            scene.add(sun);

            // Road Construction
            road = new THREE.Mesh(new THREE.PlaneGeometry(12, 1000), new THREE.MeshStandardMaterial({ color: 0x1a1a24, roughness: 0.8 }));
            road.rotation.x = -Math.PI / 2;
            road.position.z = 500;
            scene.add(road);

            // Road Edges
            const edgeMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
            const leftEdge = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.1, 1000), edgeMat);
            leftEdge.position.set(-6, 0.05, 500);
            scene.add(leftEdge);
            const rightEdge = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.1, 1000), edgeMat);
            rightEdge.position.set(6, 0.05, 500);
            scene.add(rightEdge);

            // Build Retro City Buildings
            const buildingMat = new THREE.MeshStandardMaterial({ color: 0x090514, roughness: 0.5 });
            for (let i = 0; i < 40; i++) {
                const h = 20 + Math.random() * 50;
                const buildingGeo = new THREE.BoxGeometry(8, h, 8);
                
                const leftBldg = new THREE.Mesh(buildingGeo, buildingMat);
                leftBldg.position.set(-14 - (i % 2) * 4, h / 2, i * 25 - 100);
                scene.add(leftBldg);

                const rightBldg = new THREE.Mesh(buildingGeo, buildingMat);
                rightBldg.position.set(14 + (i % 2) * 4, h / 2, i * 25 - 100);
                scene.add(rightBldg);
            }

            // Create Player Car
            car = new THREE.Group();
            const carBody = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.6, 3.8), new THREE.MeshStandardMaterial({ color: 0xff0044, metalness: 0.8, roughness: 0.2 }));
            carBody.position.y = 0.4;
            car.add(carBody);

            const carTop = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.5, 1.8), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            carTop.position.set(0, 0.85, -0.2);
            car.add(carTop);

            // Wings (Sky Ride mode)
            const wingsGroup = new THREE.Group();
            const wingMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true });
            wingsGroup.add(new THREE.Mesh(new THREE.BoxGeometry(3, 0.05, 0.8), wingMat)).position.set(-2, 0.5, 0);
            wingsGroup.add(new THREE.Mesh(new THREE.BoxGeometry(3, 0.05, 0.8), wingMat)).position.set(2, 0.5, 0);
            wingsGroup.visible = false;
            car.add(wingsGroup);
            wingsMesh = wingsGroup;

            car.position.set(0, 0, 0);
            scene.add(car);

            setupControls();
            window.addEventListener('resize', onWindowResize);
        }

        function setupControls() {
            // User interaction initializes the Web Audio context (browser policy)
            window.addEventListener('pointerdown', initAudio, { once: true });

            document.getElementById('btn-left').addEventListener('pointerdown', () => moveLeft = true);
            document.getElementById('btn-left').addEventListener('pointerup', () => moveLeft = false);
            document.getElementById('btn-right').addEventListener('pointerdown', () => moveRight = true);
            document.getElementById('btn-right').addEventListener('pointerup', () => moveRight = false);

            const nitroBtn = document.getElementById('btn-nitro');
            nitroBtn.addEventListener('pointerdown', () => { 
                isNitro = true; 
                baseSpeed = 170; 
                playSound('nitro');
            });
            nitroBtn.addEventListener('pointerup', () => { isNitro = false; baseSpeed = 70; });

            document.getElementById('btn-front').addEventListener('pointerdown', () => {
                if (isAirborne && !isFlyingMode) {
                    carRotationX += Math.PI * 2; 
                    showAnnouncement("DOUBLE BACKFLIP + ULTRA AIR!");
                    orbs += 5;
                    playSound('orb');
                }
            });
        }

        function triggerRamp() {
            if (!isAirborne) {
                isAirborne = true;
                verticalVelocity = 0.25;
                showAnnouncement("MEGA RAMP!");
                playSound('ramp');

                if (distance > 1200 && !isFlyingMode) {
                    isFlyingMode = true;
                    wingsMesh.visible = true;
                    showAnnouncement("WINGS! SKY RIDE MODE");
                }
            }
        }

        function showAnnouncement(text) {
            const ann = document.getElementById('hud-announcement');
            ann.innerText = text;
            ann.style.display = 'block';
            setTimeout(() => { ann.style.display = 'none'; }, 2000);
        }

        function animate() {
            requestAnimationFrame(animate);

            speed = THREE.MathUtils.lerp(speed, isNitro ? 170 : baseSpeed, 0.1);
            distance += Math.floor(speed * 0.05);

            if (moveLeft) targetLaneX = -laneWidth;
            else if (moveRight) targetLaneX = laneWidth;
            else targetLaneX = 0;

            car.position.x = THREE.MathUtils.lerp(car.position.x, targetLaneX, 0.1);

            if (isAirborne) {
                car.position.y += verticalVelocity;
                if (!isFlyingMode) {
                    verticalVelocity -= 0.015; 
                    if (car.position.y <= 0) {
                        car.position.y = 0;
                        isAirborne = false;
                        carRotationX = 0;
                    }
                } else {
                    car.position.y = THREE.MathUtils.lerp(car.position.y, 8, 0.05);
                    if (distance > 1600) {
                        isFlyingMode = false;
                        wingsMesh.visible = false;
                        isAirborne = false;
                        car.position.y = 0;
                    }
                }
            }

            car.rotation.x = THREE.MathUtils.lerp(car.rotation.x, carRotationX, 0.1);

            if (distance % 400 < 10 && !isAirborne) {
                triggerRamp();
            }

            document.getElementById('speed-display').innerText = `${Math.floor(speed)} km/h`;
            document.getElementById('distance-display').innerText = `${distance} m`;
            document.getElementById('orb-display').innerText = `💎 ${orbs}`;

            camera.position.x = THREE.MathUtils.lerp(camera.position.x, car.position.x * 0.5, 0.1);
            camera.lookAt(car.position.x, car.position.y + 1, car.position.z + 5);

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
