<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Redline: Ultimate Edition</title>
<style>
:root{--ac:#ff2d3d;--pn:rgba(10,8,22,.95);box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#05020a;color:#fff;font-family:"Avenir Next","Segoe UI",sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{display:none!important}
.ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);pointer-events:none}
.ui>*{pointer-events:auto}
h1{font-size:36px;line-height:1;margin:0;font-style:italic;font-weight:900;letter-spacing:1px;text-shadow:0 3px 0 var(--ac),0 0 25px #ff2d3daa}
.bank{display:inline-block;background:var(--pn);padding:6px 12px;border-radius:10px;font-weight:700;border:1px solid #3a3350}
.grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:6px;max-height:160px;overflow-y:auto;padding:4px;background:rgba(0,0,0,0.4);border-radius:12px;border:1px solid #3a3350}
.car-card{background:var(--pn);padding:8px;border-radius:8px;border:2px solid #3a3350;font-size:11px;text-align:center;cursor:pointer;font-weight:700}
.car-card.sel{border-color:var(--ac);background:#251642;box-shadow:0 0 10px var(--ac)}
.custom-row{display:flex;gap:6px;margin-top:6px;align-items:center}
.custom-row label{font-size:11px;font-weight:800;opacity:0.8}
input[type="color"]{-webkit-appearance:none;border:none;width:32px;height:24px;border-radius:6px;cursor:pointer;background:none}
input[type="color"]::-webkit-color-swatch-wrapper{padding:0}
input[type="color"]::-webkit-color-swatch{border:2px solid #fff;border-radius:6px}
button{font:inherit;color:#fff;border:0;cursor:pointer}
.big{width:100%;padding:12px;font-size:18px;font-weight:900;font-style:italic;background:var(--ac);border-radius:14px;box-shadow:0 4px 0 #a01020;margin-top:6px}
.btn-sec{background:#3a3350;box-shadow:0 4px 0 #1e192b}
#over{justify-content:center;align-items:center;background:rgba(5,2,10,0.94);text-align:center;padding:24px}
#over-content{background:var(--pn);padding:24px;border-radius:20px;border:2px solid #3a3350;width:100%;max-width:360px}
#hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;justify-content:space-between;padding:0 14px;font-weight:800;text-shadow:0 2px 6px #000;pointer-events:none}
#hud b{font-size:22px;font-style:italic;color:#00e5ff}
#status-msg{position:fixed;top:70px;left:0;right:0;text-align:center;font-weight:900;font-size:20px;font-style:italic;color:#00e5ff;text-shadow:0 0 12px #00e5ff;pointer-events:none}
#race-controls{position:fixed;bottom:25px;left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;pointer-events:none}
.control-btn{width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,0.18);border:2px solid #fff;font-size:22px;font-weight:bold;display:flex;align-items:center;justify-content:center;pointer-events:auto;backdrop-filter:blur(4px)}
.btn-boost{background:var(--ac);border-color:#ff8892}
</style>
</head>
<body>

<canvas id="c"></canvas>

<!-- HUD -->
<div id="hud" class="hide">
  <div>SPEED<br><b id="hud-speed">0</b> <small style="font-size:10px">MPH</small></div>
  <div>POWER<br><b id="hud-power" style="color:#00ffcc">READY</b></div>
  <div>DIST<br><b id="hud-dist">0</b> <small style="font-size:10px">M</small></div>
</div>

<div id="status-msg" class="hide"></div>

<!-- Mobile Controls -->
<div id="race-controls" class="hide">
  <div style="display:flex;gap:12px">
    <button class="control-btn" id="btn-left">◀</button>
    <button class="control-btn" id="btn-right">▶</button>
  </div>
  <button class="control-btn btn-boost" id="btn-boost">⚡</button>
</div>

<!-- Garage Menu -->
<div id="menu" class="ui">
  <div class="top">
    <h1>REDLINE</h1>
    <p>30+ Cars • Infinite 6-Lane Highway • Custom Studio</p>
    <div class="bank">Credits: $<span id="bank-val">5000</span></div>
  </div>
  <div>
    <div style="font-weight:800;margin-bottom:4px;font-size:12px">SELECT VEHICLE (ALL UNLOCKED)</div>
    <div class="grid" id="car-grid"></div>
    
    <div class="custom-row">
      <label>Paint:</label>
      <input type="color" id="paint-color" value="#ff2d3d" onchange="updateCustom()">
      <label style="margin-left:8px">Underglow:</label>
      <input type="color" id="glow-color" value="#00e5ff" onchange="updateCustom()">
    </div>

    <button class="big" onclick="startRace()">START HIGHWAY RUN</button>
  </div>
</div>

<!-- Game Over -->
<div id="over" class="ui hide">
  <div id="over-content">
    <h2>CRASHED!</h2>
    <p>Distance Driven: <span id="final-dist" style="color:#00e5ff;font-weight:bold">0m</span></p>
    <p>Prize Earned: <span id="final-prize" style="color:#00ffcc;font-weight:bold">$0</span></p>
    <button class="big" onclick="startRace()">RETRY RUN</button>
    <button class="big btn-sec" onclick="returnToMenu()">GARAGE</button>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let w, h;
function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Generate 32 Unlocked Cars
const carsList = [];
const carNames = [
  "Apex GT", "Viper GTS", "Cyber-X", "Neon Phantom", "Stinger V8", "Hyperion R", "Spectre", 
  "Zenith", "Omega", "Eclipse", "Venom S", "Titanium", "Blaze", "Phantom", "Rogue", "Sovereign",
  "Tornado", "Hurricane", "Cyclone", "Avalanche", "Stellar", "Quantum", "Pulse", "Reaper",
  "Striker", "Falcon", "Mantis", "Wraith", "Titan", "Demon", "Inferno", "Zero"
];
for(let i=0; i<32; i++) {
  carsList.push({
    id: i,
    name: carNames[i],
    speed: 120 + (i % 8) * 4,
    handling: 300 + (i % 5) * 20
  });
}

let selectedCarIndex = 0;
let customPaint = '#ff2d3d';
let customGlow = '#00e5ff';

function buildGarageGrid() {
  const grid = document.getElementById('car-grid');
  grid.innerHTML = '';
  carsList.forEach((car, idx) => {
    const div = document.createElement('div');
    div.className = `car-card ${idx === selectedCarIndex ? 'sel' : ''}`;
    div.innerHTML = `🚗<br>${car.name}`;
    div.onclick = () => {
      selectedCarIndex = idx;
      document.querySelectorAll('.car-card').forEach(c => c.classList.remove('sel'));
      div.classList.add('sel');
    };
    grid.appendChild(div);
  });
}
buildGarageGrid();

function updateCustom() {
  customPaint = document.getElementById('paint-color').value;
  customGlow = document.getElementById('glow-color').value;
}

let gameState = 'menu';
let credits = 5000;
let distance = 0;
let speed = 0;
let carX = 0;
let traffic = [];
let powerups = [];
let roadOffset = 0;
let keys = { left: false, right: false, boost: false };
let lastSpawn = 0;
let shieldActive = false;
let stuntMode = null; 
let stuntAnim = 0;
let messageTimer = 0;

function updateBank() {
  document.getElementById('bank-val').innerText = credits;
}

function showStatus(text) {
  const el = document.getElementById('status-msg');
  el.innerText = text;
  el.classList.remove('hide');
  messageTimer = 1.5;
}

function startRace() {
  document.getElementById('menu').classList.add('hide');
  document.getElementById('over').classList.add('hide');
  document.getElementById('hud').classList.remove('hide');
  document.getElementById('race-controls').classList.remove('hide');
  
  gameState = 'racing';
  distance = 0;
  speed = 50;
  carX = 0;
  traffic = [];
  powerups = [];
  roadOffset = 0;
  shieldActive = false;
  stuntMode = null;
  lastSpawn = performance.now();
}

function endRace() {
  gameState = 'over';
  document.getElementById('hud').classList.add('hide');
  document.getElementById('race-controls').classList.add('hide');
  document.getElementById('status-msg').classList.add('hide');
  document.getElementById('over').classList.remove('hide');
  
  const earned = Math.floor(distance * 0.7);
  credits += earned;
  
  document.getElementById('final-dist').innerText = Math.floor(distance) + 'm';
  document.getElementById('final-prize').innerText = '$' + earned;
  updateBank();
}

function returnToMenu() {
  document.getElementById('over').classList.add('hide');
  document.getElementById('menu').classList.remove('hide');
  gameState = 'menu';
}

const bindBtn = (id, keyName) => {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
  el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
  el.addEventListener('mousedown', () => { keys[keyName] = true; });
  el.addEventListener('mouseup', () => { keys[keyName] = false; });
};
bindBtn('btn-left', 'left');
bindBtn('btn-right', 'right');
bindBtn('btn-boost', 'boost');

function drawCar(x, y, scale, color, glowColor, isPlayer = false, nitro = false, angle = 0) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.scale(scale, scale);

  const carW = 44;
  const carH = 80;

  // Underglow Aura
  if (isPlayer) {
    ctx.strokeStyle = glowColor;
    ctx.lineWidth = 4;
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = 18;
    ctx.strokeRect(-carW/2 - 4, -carH/2 - 4, carW + 8, carH + 8);
  }

  // Wheels
  ctx.fillStyle = '#050508';
  ctx.fillRect(-carW/2 - 5, -carH/2 + 12, 6, 20);
  ctx.fillRect(carW/2 - 1, -carH/2 + 12, 6, 20);
  ctx.fillRect(-carW/2 - 5, carH/2 - 30, 6, 20);
  ctx.fillRect(carW/2 - 1, carH/2 - 30, 6, 20);

  // Body
  ctx.fillStyle = color;
  ctx.fillRect(-carW/2, -carH/2, carW, carH);

  // Cabin & Windshield
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(-carW/2 + 6, -carH/2 + 22, carW - 12, carH - 40);

  ctx.fillStyle = '#38bdf8';
  ctx.fillRect(-carW/2 + 8, -carH/2 + 24, carW - 16, 12);
  ctx.fillRect(-carW/2 + 8, carH/2 - 30, carW - 16, 10);

  if (isPlayer) {
    ctx.fillStyle = '#ef4444';
    ctx.shadowColor = '#ef4444';
    ctx.shadowBlur = 12;
    ctx.fillRect(-carW/2 + 3, carH/2 - 3, 8, 4);
    ctx.fillRect(carW/2 - 11, carH/2 - 3, 8, 4);
    
    if (shieldActive) {
      ctx.strokeStyle = '#00e5ff';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#00e5ff';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(0, 0, carW * 0.9, 0, Math.PI * 2);
      ctx.stroke();
    }

    if (nitro) {
      ctx.fillStyle = '#00e5ff';
      ctx.shadowColor = '#00e5ff';
      ctx.shadowBlur = 20;
      ctx.fillRect(-10, carH/2, 20, 25 + Math.random() * 12);
    }
  } else {
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 10;
    ctx.fillRect(-carW/2 + 3, -carH/2, 8, 4);
    ctx.fillRect(carW/2 - 11, -carH/2, 8, 4);
  }

  ctx.restore();
}

let lastTime = performance.now();
function loop(time) {
  const dt = (time - lastTime) / 1000;
  lastTime = time;

  ctx.clearRect(0, 0, w, h);

  if (messageTimer > 0) {
    messageTimer -= dt;
    if (messageTimer <= 0) document.getElementById('status-msg').classList.add('hide');
  }

  if (gameState === 'racing') {
    let activeCar = carsList[selectedCarIndex];
    let currentMaxSpeed = activeCar.speed + (keys.boost ? 60 : 0);
    speed += (currentMaxSpeed - speed) * 0.04;
    distance += speed * dt * 3;

    let handling = activeCar.handling;
    if (keys.left) carX -= handling * dt;
    if (keys.right) carX += handling * dt;

    let roadWidth = Math.min(w * 0.85, 400);
    carX = Math.max(-roadWidth/2 + 25, Math.min(roadWidth/2 - 25, carX));

    roadOffset = (roadOffset + speed * dt * 30) % 40;

    if (stuntMode) {
      stuntAnim -= dt;
      if (stuntAnim <= 0) stuntMode = null;
    }

    // Spawn Traffic & Stunts
    if (time - lastSpawn > 450) {
      const laneWidth = roadWidth / 6;
      const lanes = [-roadWidth/2 + laneWidth/2, -roadWidth/2 + laneWidth*1.5, -roadWidth/2 + laneWidth*2.5, -roadWidth/2 + laneWidth*3.5, -roadWidth/2 + laneWidth*4.5, -roadWidth/2 + laneWidth*5.5];
      const selectedLane = lanes[Math.floor(Math.random() * lanes.length)];
      const colors = ['#06b6d4', '#f59e0b', '#8b5cf6', '#10b981', '#ec4899', '#3b82f6'];
      
      const rand = Math.random();
      if (rand < 0.25) {
        powerups.push({ x: selectedLane, y: -120, type: Math.random() > 0.5 ? 'shield' : 'nitro' });
      } else if (rand < 0.55) {
        traffic.push({ x: selectedLane, y: -120, type: Math.random() > 0.5 ? 'ramp' : 'loop' });
      } else {
        traffic.push({ x: selectedLane, y: -120, type: 'car', speedFactor: 0.3 + Math.random() * 0.3, color: colors[Math.floor(Math.random() * colors.length)] });
      }
      lastSpawn = time;
    }

    // Update Traffic & Stunts
    for (let i = traffic.length - 1; i >= 0; i--) {
      let t = traffic[i];
      t.y += (t.type === 'car' ? (speed * (1 - t.speedFactor)) : speed) * dt * 5.5;

      let playerX = w / 2 + carX;
      let playerY = h - 130;
      let targetX = w / 2 + t.x;

      if (Math.abs(playerX - targetX) < 38 && Math.abs(playerY - t.y) < 55) {
        if (t.type === 'ramp') {
          stuntMode = 'ramp';
          stuntAnim = 1.3;
          showStatus('MEGA RAMP LAUNCH! 🚀');
          traffic.splice(i, 1);
          continue;
        } else if (t.type === 'loop') {
          stuntMode = 'loop';
          stuntAnim = 1.6;
          showStatus('FULL 360° HYPER LOOP! 🌀');
          traffic.splice(i, 1);
          continue;
        }

        if (shieldActive) {
          shieldActive = false;
          showStatus('SHIELD SAVED YOU! 🛡️');
          traffic.splice(i, 1);
        } else if (stuntMode) {
          traffic.splice(i, 1);
        } else {
          endRace();
        }
      }

      if (t.y > h + 100) traffic.splice(i, 1);
    }

    // Update Powerups
    for (let i = powerups.length - 1; i >= 0; i--) {
      let p = powerups[i];
      p.y += speed * dt * 5.5;

      let playerX = w / 2 + carX;
      let playerY = h - 130;

      if (Math.abs(playerX - (w/2 + p.x)) < 36 && Math.abs(playerY - p.y) < 45) {
        if (p.type === 'shield') {
          shieldActive = true;
          showStatus('SHIELD ACTIVATED! 🛡️');
        } else {
          keys.boost = true;
          setTimeout(() => keys.boost = false, 3000);
          showStatus('SUPER NITRO BOOST! ⚡');
        }
        powerups.splice(i, 1);
      }

      if (p.y > h + 100) powerups.splice(i, 1);
    }

    // Update HUD
    document.getElementById('hud-speed').innerText = Math.round(speed);
    document.getElementById('hud-power').innerText = shieldActive ? 'SHIELDED' : (stuntMode ? stuntMode.toUpperCase() : 'READY');
    document.getElementById('hud-dist').innerText = Math.floor(distance) + 'm';

    // RENDER HIGH-END CYBERPUNK SCENE
    ctx.fillStyle = '#05020a';
    ctx.fillRect(0, 0, w, h);

    // Glowing Horizon Sun
    let cx = w / 2;
    let sunGradient = ctx.createRadialGradient(cx, h * 0.35, 10, cx, h * 0.35, 160);
    sunGradient.addColorStop(0, '#ff007f');
    sunGradient.addColorStop(1, 'rgba(13,7,26,0)');
    ctx.fillStyle = sunGradient;
    ctx.fillRect(cx - 200, 0, 400, h * 0.6);

    // Road Asphalt
    ctx.fillStyle = '#100a20';
    ctx.fillRect(cx - roadWidth/2, 0, roadWidth, h);

    // Guardrails
    ctx.fillStyle = '#ff2d3d';
    ctx.shadowColor = '#ff2d3d';
    ctx.shadowBlur = 10;
    ctx.fillRect(cx - roadWidth/2 - 6, 0, 6, h);
    ctx.fillRect(cx + roadWidth/2, 0, 6, h);
    ctx.shadowBlur = 0;

    // 6-Lane Dividers
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.lineWidth = 2;
    ctx.setLineDash([22, 22]);
    ctx.lineDashOffset = -roadOffset;

    let laneW = roadWidth / 6;
    for (let l = 1; l <= 5; l++) {
      ctx.beginPath();
      ctx.moveTo(cx - roadWidth/2 + laneW * l, 0);
      ctx.lineTo(cx - roadWidth/2 + laneW * l, h);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    // Draw Obstacles & Traffic
    for (let t of traffic) {
      if (t.type === 'car') {
        drawCar(cx + t.x, t.y, 1.0, t.color, '#000', false);
      } else if (t.type === 'ramp') {
        ctx.fillStyle = '#f59e0b';
        ctx.shadowColor = '#f59e0b';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(cx + t.x - 28, t.y + 35);
        ctx.lineTo(cx + t.x + 28, t.y + 35);
        ctx.lineTo(cx + t.x + 28, t.y);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 10px sans-serif';
        ctx.fillText('RAMP', cx + t.x - 15, t.y + 22);
      } else if (t.type === 'loop') {
        ctx.strokeStyle = '#00e5ff';
        ctx.lineWidth = 6;
        ctx.shadowColor = '#00e5ff';
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.arc(cx + t.x, t.y + 20, 26, 0, Math.PI * 2);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
    }

    // Draw Powerups
    for (let p of powerups) {
      ctx.fillStyle = p.type === 'shield' ? '#00e5ff' : '#ff2d3d';
      ctx.shadowColor = ctx.fillStyle;
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(cx + p.x, p.y, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText(p.type === 'shield' ? '🛡️' : '⚡', cx + p.x - 6, p.y + 4);
    }

    // Player Physics & Stunt Transformations
    let playerScale = 1.0;
    let playerYOffset = 0;
    let playerAngle = 0;

    if (stuntMode === 'ramp') {
      let progress = 1 - (stuntAnim / 1.3);
      playerScale = 1.0 + Math.sin(progress * Math.PI) * 0.7;
      playerYOffset = -Math.sin(progress * Math.PI) * 85;
      playerAngle = Math.sin(progress * Math.PI) * 0.2;
    } else if (stuntMode === 'loop') {
      let progress = 1 - (stuntAnim / 1.6);
      playerScale = 0.75 + Math.sin(progress * Math.PI) * 0.4;
      playerAngle = progress * Math.PI * 2;
    }

    drawCar(cx + carX, (h - 130) + playerYOffset, playerScale, customPaint, customGlow, true, keys.boost, playerAngle);
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
updateBank();
</script>
</body>
</html>
