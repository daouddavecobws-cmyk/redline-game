<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Redline: Endless Highway</title>
<style>
:root{--ac:#ff2d3d;--pn:rgba(12,10,26,.92);box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#0d071a;color:#fff;font-family:"Avenir Next","Segoe UI",sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{display:none!important}
.ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);pointer-events:none}
.ui>*{pointer-events:auto}
h1{font-size:38px;line-height:1;margin:0;font-style:italic;font-weight:900;letter-spacing:1px;text-shadow:0 3px 0 var(--ac),0 0 20px #ff2d3daa}
.bank{display:inline-block;background:var(--pn);padding:6px 12px;border-radius:10px;font-weight:700;border:1px solid #3a3350}
.row{display:flex;gap:8px;overflow-x:auto;padding:4px 0;margin-bottom:8px}
.card{flex:0 0 auto;min-width:105px;padding:10px;border-radius:12px;background:var(--pn);border:2px solid #3a3350;font-size:11px;line-height:1.3;cursor:pointer}
.card.sel{border-color:var(--ac);background:#251642}
button{font:inherit;color:#fff;border:0;cursor:pointer}
.big{width:100%;padding:14px;font-size:18px;font-weight:900;font-style:italic;background:var(--ac);border-radius:14px;box-shadow:0 4px 0 #a01020;margin-top:6px}
.btn-sec{background:#3a3350;box-shadow:0 4px 0 #1e192b}
#over{justify-content:center;align-items:center;background:rgba(10,5,20,0.92);text-align:center;padding:24px}
#over-content{background:var(--pn);padding:24px;border-radius:20px;border:2px solid #3a3350;width:100%;max-width:360px}
#over h2{font-size:32px;margin:0 0 6px;font-style:italic}
#hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;justify-content:space-between;padding:0 14px;font-weight:800;text-shadow:0 2px 6px #000;pointer-events:none}
#hud b{font-size:22px;font-style:italic;color:#00e5ff}
#status-msg{position:fixed;top:70px;left:0;right:0;text-align:center;font-weight:900;font-size:20px;font-style:italic;color:#00e5ff;text-shadow:0 0 10px #00e5ff;pointer-events:none}
#race-controls{position:fixed;bottom:25px;left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;pointer-events:none}
.control-btn{width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,0.18);border:2px solid #fff;font-size:22px;font-weight:bold;display:flex;align-items:center;justify-content:center;pointer-events:auto;backdrop-filter:blur(4px)}
.btn-boost{background:var(--ac);border-color:#ff8892}
</style>
</head>
<body>

<canvas id="c"></canvas>

<!-- HUD -->
<div id="hud" class="hide">
  <div>SPEED<br><b id="hud-speed">0</b> <small style="font-size:10px">MPH</small></div>
  <div>POWER<br><b id="hud-power" style="color:#00ffcc">READY</b></div>
  <div>DIST<br><b id="hud-dist">0</b> <small style="font-size:10px">M</small></div>
</div>

<div id="status-msg" class="hide"></div>

<!-- Mobile Controls -->
<div id="race-controls" class="hide">
  <div style="display:flex;gap:12px">
    <button class="control-btn" id="btn-left">◀</button>
    <button class="control-btn" id="btn-right">▶</button>
  </div>
  <button class="control-btn btn-boost" id="btn-boost">⚡</button>
</div>

<!-- Garage Menu -->
<div id="menu" class="ui">
  <div class="top">
    <h1>REDLINE</h1>
    <p>Endless 6-Lane Highway, Stunts & Traffic.</p>
    <div class="bank">Credits: $<span id="bank-val">1000</span></div>
  </div>
  <div>
    <div style="font-weight:800;margin-bottom:6px;font-size:13px">GARAGE UPGRADES</div>
    <div class="row">
      <div class="card" id="card-engine" onclick="buyUpgrade('engine', 150)">
        <b>Engine V8</b><br>+Top Speed<br><span style="color:var(--ac)">$150</span>
      </div>
      <div class="card" id="card-aero" onclick="buyUpgrade('aero', 100)">
        <b>Aero Kit</b><br>+Handling<br><span style="color:var(--ac)">$100</span>
      </div>
      <div class="card" id="card-nitro" onclick="buyUpgrade('nitro', 200)">
        <b>Nitro Boost</b><br>+Duration<br><span style="color:var(--ac)">$200</span>
      </div>
    </div>
    <button class="big" onclick="startRace()">START HIGHWAY RUN</button>
  </div>
</div>

<!-- Game Over Screen -->
<div id="over" class="ui hide">
  <div id="over-content">
    <h2>CRASHED!</h2>
    <p>Distance Driven: <span id="final-dist" style="color:#00e5ff;font-weight:bold">0m</span></p>
    <p>Prize Earned: <span id="final-prize" style="color:#00ffcc;font-weight:bold">$0</span></p>
    <button class="big" onclick="startRace()">RETRY RUN</button>
    <button class="big btn-sec" onclick="returnToMenu()">GARAGE</button>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let w, h;
function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

let gameState = 'menu';
let credits = 1000;
let upgrades = { engine: 1, aero: 1, nitro: 1 };
let distance = 0;
let speed = 0;
let baseMaxSpeed = 130;
let carX = 0;
let traffic = [];
let powerups = [];
let scenery = [];
let roadOffset = 0;
let keys = { left: false, right: false, boost: false };
let lastSpawn = 0;
let shieldActive = false;
let stuntMode = null;
let stuntTimer = 0;
let messageTimer = 0;

function updateBank() {
  document.getElementById('bank-val').innerText = credits;
}

function buyUpgrade(type, cost) {
  if (credits >= cost) {
    credits -= cost;
    upgrades[type]++;
    baseMaxSpeed += 15;
    document.getElementById('card-' + type).classList.add('sel');
    updateBank();
  }
}

function showStatus(text) {
  const el = document.getElementById('status-msg');
  el.innerText = text;
  el.classList.remove('hide');
  messageTimer = 1.5;
}

function startRace() {
  document.getElementById('menu').classList.add('hide');
  document.getElementById('over').classList.add('hide');
  document.getElementById('hud').classList.remove('hide');
  document.getElementById('race-controls').classList.remove('hide');
  
  gameState = 'racing';
  distance = 0;
  speed = 50;
  carX = 0;
  traffic = [];
  powerups = [];
  scenery = [];
  roadOffset = 0;
  shieldActive = false;
  stuntMode = null;
  lastSpawn = performance.now();

  for(let i=0; i<12; i++) {
    scenery.push({
      y: i * 80,
      side: i % 2 === 0 ? -1 : 1,
      type: Math.random() > 0.4 ? 'building' : 'tree',
      height: 80 + Math.random() * 100,
      width: 50 + Math.random() * 40,
      color: ['#1e1b4b', '#31103f', '#0f172a'][Math.floor(Math.random()*3)]
    });
  }
}

function endRace() {
  gameState = 'over';
  document.getElementById('hud').classList.add('hide');
  document.getElementById('race-controls').classList.add('hide');
  document.getElementById('status-msg').classList.add('hide');
  document.getElementById('over').classList.remove('hide');
  
  const earned = Math.floor(distance * 0.6);
  credits += earned;
  
  document.getElementById('final-dist').innerText = Math.floor(distance) + 'm';
  document.getElementById('final-prize').innerText = '$' + earned;
  updateBank();
}

function returnToMenu() {
  document.getElementById('over').classList.add('hide');
  document.getElementById('menu').classList.remove('hide');
  gameState = 'menu';
}

// Touch Bindings
const bindBtn = (id, keyName) => {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
  el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
  el.addEventListener('mousedown', () => { keys[keyName] = true; });
  el.addEventListener('mouseup', () => { keys[keyName] = false; });
};
bindBtn('btn-left', 'left');
bindBtn('btn-right', 'right');
bindBtn('btn-boost', 'boost');

// Proportional Car Drawing
function drawCar(x, y, scale, color, isPlayer = false, nitro = false) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);

  const carW = 42;
  const carH = 76;

  // Wheels
  ctx.fillStyle = '#0f0f15';
  ctx.fillRect(-carW/2 - 4, -carH/2 + 10, 5, 18);
  ctx.fillRect(carW/2 - 1, -carH/2 + 10, 5, 18);
  ctx.fillRect(-carW/2 - 4, carH/2 - 28, 5, 18);
  ctx.fillRect(carW/2 - 1, carH/2 - 28, 5, 18);

  // Body
  ctx.fillStyle = color;
  ctx.fillRect(-carW/2, -carH/2, carW, carH);

  // Cabin
  ctx.fillStyle = '#111827';
  ctx.fillRect(-carW/2 + 6, -carH/2 + 20, carW - 12, carH - 38);

  // Windshield & Rear window
  ctx.fillStyle = '#38bdf8';
  ctx.fillRect(-carW/2 + 8, -carH/2 + 22, carW - 16, 12);
  ctx.fillRect(-carW/2 + 8, carH/2 - 28, carW - 16, 10);

  if (isPlayer) {
    // Tail lights
    ctx.fillStyle = '#ef4444';
    ctx.shadowColor = '#ef4444';
    ctx.shadowBlur = 10;
    ctx.fillRect(-carW/2 + 3, carH/2 - 3, 8, 4);
    ctx.fillRect(carW/2 - 11, carH/2 - 3, 8, 4);
    
    if (shieldActive) {
      ctx.strokeStyle = '#00e5ff';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#00e5ff';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(0, 0, carW * 0.85, 0, Math.PI * 2);
      ctx.stroke();
    }

    if (nitro) {
      ctx.fillStyle = '#00e5ff';
      ctx.shadowColor = '#00e5ff';
      ctx.shadowBlur = 15;
      ctx.fillRect(-8, carH/2, 16, 22 + Math.random() * 10);
    }
  } else {
    // Traffic Headlights
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 8;
    ctx.fillRect(-carW/2 + 3, -carH/2, 8, 4);
    ctx.fillRect(carW/2 - 11, -carH/2, 8, 4);
  }

  ctx.restore();
}

let lastTime = performance.now();
function loop(time) {
  const dt = (time - lastTime) / 1000;
  lastTime = time;

  ctx.clearRect(0, 0, w, h);

  if (messageTimer > 0) {
    messageTimer -= dt;
    if (messageTimer <= 0) document.getElementById('status-msg').classList.add('hide');
  }

  if (gameState === 'racing') {
    let currentMaxSpeed = baseMaxSpeed + (keys.boost ? 55 * upgrades.nitro : 0);
    speed += (currentMaxSpeed - speed) * 0.04;
    distance += speed * dt * 3;

    let handling = 300 + (upgrades.aero * 40);
    if (keys.left) carX -= handling * dt;
    if (keys.right) carX += handling * dt;

    let roadWidth = Math.min(w * 0.82, 380);
    carX = Math.max(-roadWidth/2 + 25, Math.min(roadWidth/2 - 25, carX));

    roadOffset = (roadOffset + speed * dt * 25) % 40;

    if (stuntMode) {
      stuntTimer -= dt;
      if (stuntTimer <= 0) stuntMode = null;
    }

    // Spawn Traffic, Powerups & Ramps across 6 Lanes
    if (time - lastSpawn > Math.max(900 - (speed * 2.5), 450)) {
      const laneWidth = roadWidth / 6;
      const lanes = [-roadWidth/2 + laneWidth/2, -roadWidth/2 + laneWidth*1.5, -roadWidth/2 + laneWidth*2.5, -roadWidth/2 + laneWidth*3.5, -roadWidth/2 + laneWidth*4.5, -roadWidth/2 + laneWidth*5.5];
      const selectedLane = lanes[Math.floor(Math.random() * lanes.length)];
      const colors = ['#06b6d4', '#f59e0b', '#8b5cf6', '#10b981', '#ec4899'];
      
      const isPowerup = Math.random() < 0.2;
      const isRamp = !isPowerup && Math.random() < 0.15;

      if (isPowerup) {
        powerups.push({
          x: selectedLane,
          y: -120,
          type: Math.random() > 0.5 ? 'shield' : 'nitro'
        });
      } else if (isRamp) {
        traffic.push({
          x: selectedLane,
          y: -120,
          type: Math.random() > 0.5 ? 'ramp' : 'loop',
          width: 50,
          height: 40
        });
      } else {
        traffic.push({
          x: selectedLane,
          y: -120,
          type: 'car',
          speedFactor: 0.3 + Math.random() * 0.3,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }
      lastSpawn = time;
    }

    // Update Traffic
    for (let i = traffic.length - 1; i >= 0; i--) {
      let t = traffic[i];
      t.y += (t.type === 'car' ? (speed * (1 - t.speedFactor)) : speed) * dt * 5;

      let playerX = w / 2 + carX;
      let playerY = h - 130;
      let targetX = w / 2 + t.x;

      if (Math.abs(playerX - targetX) < 36 && Math.abs(playerY - t.y) < 55) {
        if (t.type === 'ramp') {
          stuntMode = 'ramp';
          stuntTimer = 2.0;
          showStatus('MEGA JUMP! 🚀');
          traffic.splice(i, 1);
          continue;
        } else if (t.type === 'loop') {
          stuntMode = 'loop';
          stuntTimer = 2.5;
          showStatus('LOOP-DE-LOOP! 🌀');
          traffic.splice(i, 1);
          continue;
        }

        if (shieldActive) {
          shieldActive = false;
          showStatus('SHIELD SAVED YOU! 🛡️');
          traffic.splice(i, 1);
        } else if (stuntMode) {
          traffic.splice(i, 1);
        } else {
          endRace();
        }
      }

      if (t.y > h + 100) traffic.splice(i, 1);
    }

    // Update Powerups
    for (let i = powerups.length - 1; i >= 0; i--) {
      let p = powerups[i];
      p.y += speed * dt * 5;

      let playerX = w / 2 + carX;
      let playerY = h - 130;

      if (Math.abs(playerX - (w/2 + p.x)) < 36 && Math.abs(playerY - p.y) < 45) {
        if (p.type === 'shield') {
          shieldActive = true;
          showStatus('SHIELD ACTIVATED! 🛡️');
        } else {
          keys.boost = true;
          setTimeout(() => keys.boost = false, 3000);
          showStatus('SUPER NITRO BOOST! ⚡');
        }
        powerups.splice(i, 1);
      }

      if (p.y > h + 100) powerups.splice(i, 1);
    }

    // Update HUD
    document.getElementById('hud-speed').innerText = Math.round(speed);
    document.getElementById('hud-power').innerText = shieldActive ? 'SHIELDED' : (stuntMode ? stuntMode.toUpperCase() : 'READY');
    document.getElementById('hud-dist').innerText = Math.floor(distance) + 'm';

    // RENDER SCENE
    ctx.fillStyle = '#080414';
    ctx.fillRect(0, 0, w, h);

    let cx = w / 2;

    // Road Asphalt
    ctx.fillStyle = '#140c26';
    ctx.fillRect(cx - roadWidth/2, 0, roadWidth, h);

    // Guardrails
    ctx.fillStyle = '#ff2d3d';
    ctx.fillRect(cx - roadWidth/2 - 6, 0, 6, h);
    ctx.fillRect(cx + roadWidth/2, 0, 6, h);

    // 6-Lane Dividers
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
    ctx.lineWidth = 2;
    ctx.setLineDash([20, 20]);
    ctx.lineDashOffset = -roadOffset;

    let laneW = roadWidth / 6;
    for (let l = 1; l <= 5; l++) {
      ctx.beginPath();
      ctx.moveTo(cx - roadWidth/2 + laneW * l, 0);
      ctx.lineTo(cx - roadWidth/2 + laneW * l, h);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    // Draw Traffic & Stunt Elements
    for (let t of traffic) {
      if (t.type === 'car') {
        drawCar(cx + t.x, t.y, 1.0, t.color, false);
      } else if (t.type === 'ramp') {
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(cx + t.x - 25, t.y, 50, 30);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText('RAMP', cx + t.x - 16, t.y + 20);
      } else if (t.type === 'loop') {
        ctx.strokeStyle = '#00e5ff';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(cx + t.x, t.y + 20, 22, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    // Draw Powerups
    for (let p of powerups) {
      ctx.fillStyle = p.type === 'shield' ? '#00e5ff' : '#ff2d3d';
      ctx.shadowColor = ctx.fillStyle;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(cx + p.x, p.y, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText(p.type === 'shield' ? '🛡️' : '⚡', cx + p.x - 6, p.y + 4);
    }

    // Draw Player Car (Exact Same Proportional Scale as Traffic)
    let playerScale = stuntMode === 'ramp' ? 1.35 : (stuntMode === 'loop' ? 0.75 : 1.0);
    drawCar(cx + carX, h - 130, playerScale, '#ff2d3d', true, keys.boost);
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
updateBank();
</script>
</body>
</html>
