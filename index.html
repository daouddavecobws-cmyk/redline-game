<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Redline</title>
<style>
:root{--ac:#ff2d3d;--pn:rgba(12,10,26,.82);box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#150b2b;color:#fff;font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{display:none!important}
.ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);pointer-events:none}
.ui>*{pointer-events:auto}
h1{font-size:48px;line-height:1;margin:0;font-style:italic;font-weight:900;letter-spacing:1px;text-shadow:0 3px 0 var(--ac),0 0 24px #ff2d3d88}
.top p{margin:6px 0 10px;opacity:.85}
.bank{display:inline-block;background:var(--pn);padding:6px 12px;border-radius:10px;font-weight:700}
.row{display:flex;gap:8px;overflow-x:auto;padding:4px 0;margin-bottom:8px;touch-action:pan-x}
.card{flex:0 0 auto;min-width:112px;padding:10px;border-radius:12px;background:var(--pn);border:2px solid #3a3350;font-size:13px;line-height:1.35;cursor:pointer;transition:0.2s}
.card.sel{border-color:var(--ac);background:#251642}
.card.lock{opacity:.55}
button{font:inherit;color:#fff;border:0;cursor:pointer}
.big{width:100%;padding:16px;font-size:22px;font-weight:900;font-style:italic;background:var(--ac);border-radius:14px;box-shadow:0 4px 0 #a01020;transition:transform 0.1s}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 #a01020}
.ghost{background:transparent;border:2px solid #7a7090;border-radius:14px;padding:12px;width:100%;margin-top:10px}
#over{justify-content:center;background:rgba(0,0,0,0.85);text-align:center}
#over h2{font-size:40px;margin:0 0 8px;font-style:italic}
#over p{margin:4px 0 10px;font-size:18px}
#unl{color:#00e5ff;font-weight:800}
#hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;justify-content:space-between;padding:0 14px;font-weight:800;text-shadow:0 2px 6px #000;pointer-events:none}
#hud b{font-size:32px;font-style:italic}
#race-controls{position:fixed;bottom:30px;left:0;right:0;display:flex;justify-content:space-around;padding:0 20px;}
.control-btn{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,0.15);border:2px solid #fff;font-size:28px;font-weight:bold;display:flex;align-items:center;justify-content:center;pointer-events:auto;backdrop-filter:blur(4px)}
</style>
</head>
<body>

<canvas id="c"></canvas>

<!-- HUD during race -->
<div id="hud" class="hide">
  <div>SPEED<br><b id="hud-speed">0</b> MPH</div>
  <div>DIST<br><b id="hud-dist">0</b>m</div>
</div>

<!-- Race Control Buttons -->
<div id="race-controls" class="hide">
  <button class="control-btn" id="btn-left">◀</button>
  <button class="control-btn" id="btn-boost" style="background:var(--ac);border-color:#ff8892">⚡</button>
  <button class="control-btn" id="btn-right">▶</button>
</div>

<!-- Garage / Menu Screen -->
<div id="menu" class="ui">
  <div class="top">
    <h1>REDLINE</h1>
    <p>Push your machine to the absolute limit.</p>
    <div class="bank">Credits: $<span id="bank-val">500</span></div>
  </div>
  <div>
    <div style="font-weight:800;margin-bottom:6px">UPGRADES</div>
    <div class="row" id="upgrade-list">
      <div class="card sel" onclick="buyUpgrade('engine', 150)">
        <b>Engine V8</b><br>+Top Speed<br><span style="color:var(--ac)">$150</span>
      </div>
      <div class="card" onclick="buyUpgrade('aero', 100)">
        <b>Aero Wing</b><br>+Handling<br><span style="color:var(--ac)">$100</span>
      </div>
      <div class="card" onclick="buyUpgrade('nitro', 200)">
        <b>Nitrous</b><br>+Boost Power<br><span style="color:var(--ac)">$200</span>
      </div>
    </div>
    <button class="big" onclick="startRace()">START RACE</button>
  </div>
</div>

<!-- Game Over / Victory Screen -->
<div id="over" class="ui hide">
  <div>
    <h2 id="over-title">RACE FINISHED</h2>
    <p id="over-desc">You survived the redline.</p>
    <p>Reward Earned: <span id="unl">$0</span></p>
    <button class="big" onclick="returnToMenu()">BACK TO GARAGE</button>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let w, h;
function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Game State
let gameState = 'menu'; // menu, racing, over
let credits = 500;
let upgrades = { engine: 1, aero: 1, nitro: 1 };
let distance = 0;
let targetDistance = 2000;
let speed = 0;
let maxSpeed = 120;
let carX = 0;
let obstacles = [];
let particles = [];
let keys = { left: false, right: false, boost: false };

function updateBank() {
  document.getElementById('bank-val').innerText = credits;
}

function buyUpgrade(type, cost) {
  if (credits >= cost) {
    credits -= cost;
    upgrades[type]++;
    maxSpeed += 25;
    updateBank();
  }
}

function startRace() {
  document.getElementById('menu').classList.add('hide');
  document.getElementById('hud').classList.remove('hide');
  document.getElementById('race-controls').classList.remove('hide');
  
  gameState = 'racing';
  distance = 0;
  speed = 40;
  carX = 0;
  obstacles = [];
  particles = [];
}

function endRace(won) {
  gameState = 'over';
  document.getElementById('hud').classList.add('hide');
  document.getElementById('race-controls').classList.add('hide');
  document.getElementById('over').classList.remove('hide');
  
  const earned = won ? 450 + (upgrades.engine * 50) : 100;
  credits += earned;
  
  document.getElementById('over-title').innerText = won ? 'VICTORY!' : 'CRASHED!';
  document.getElementById('over-desc').innerText = won ? 'You crossed the finish line successfully.' : 'Your car hit an obstacle and spun out.';
  document.getElementById('unl').innerText = '$' + earned;
  updateBank();
}

function returnToMenu() {
  document.getElementById('over').classList.add('hide');
  document.getElementById('menu').classList.remove('hide');
  gameState = 'menu';
}

// Controls
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  if (e.key === ' ' || e.key === 'Shift') keys.boost = true;
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
  if (e.key === ' ' || e.key === 'Shift') keys.boost = false;
});

// Mobile button touch bindings
const bindButton = (id, keyName) => {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
  el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
  el.addEventListener('mousedown', () => { keys[keyName] = true; });
  el.addEventListener('mouseup', () => { keys[keyName] = false; });
};
bindButton('btn-left', 'left');
bindButton('btn-right', 'right');
bindButton('btn-boost', 'boost');

// Game Loop
let lastTime = performance.now();
function loop(time) {
  const dt = (time - lastTime) / 1000;
  lastTime = time;

  ctx.clearRect(0, 0, w, h);

  if (gameState === 'racing') {
    // Update physics
    let targetMaxSpeed = maxSpeed + (keys.boost ? 60 * upgrades.nitro : 0);
    speed += (targetMaxSpeed - speed) * 0.05;
    distance += speed * dt * 5;

    let handling = 300 + (upgrades.aero * 50);
    if (keys.left) carX -= handling * dt;
    if (keys.right) carX += handling * dt;
    
    // Boundary check
    let roadWidth = Math.min(w * 0.45, 250);
    carX = Math.max(-roadWidth + 30, Math.min(roadWidth - 30, carX));

    // Spawn obstacles
    if (Math.random() < 0.03 + (speed / 1000)) {
      obstacles.push({
        x: (Math.random() - 0.5) * (roadWidth * 1.5),
        y: -100,
        width: 45,
        height: 35
      });
    }

    // Update obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
      obstacles[i].y += speed * dt * 2.5;
      
      // Collision detection
      let carScreenX = w / 2 + carX;
      let carScreenY = h - 140;
      let obsScreenX = w / 2 + obstacles[i].x;
      let obsScreenY = obstacles[i].y;

      if (Math.abs(carScreenX - obsScreenX) < 35 && Math.abs(carScreenY - obsScreenY) < 35) {
        endRace(false);
      }

      if (obstacles[i].y > h + 100) {
        obstacles.splice(i, 1);
      }
    }

    // Check win condition
    if (distance >= targetDistance) {
      endRace(true);
    }

    // Update HUD
    document.getElementById('hud-speed').innerText = Math.round(speed);
    document.getElementById('hud-dist').innerText = Math.floor(targetDistance - distance);

    // --- Render Racetrack ---
    ctx.fillStyle = '#100820';
    ctx.fillRect(0, 0, w, h);

    // Draw Road
    let cx = w / 2;
    ctx.fillStyle = '#1e1236';
    ctx.beginPath();
    ctx.moveTo(cx - roadWidth - 40, h);
    ctx.lineTo(cx + roadWidth + 40, h);
    ctx.lineTo(cx + roadWidth, 0);
    ctx.lineTo(cx - roadWidth, 0);
    ctx.fill();

    ctx.strokeStyle = '#ff2d3d';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(cx - roadWidth, 0);
    ctx.lineTo(cx - roadWidth - 40, h);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx + roadWidth, 0);
    ctx.lineTo(cx + roadWidth + 40, h);
    ctx.stroke();

    // Draw Obstacles
    for (let obs of obstacles) {
      let ox = w / 2 + obs.x;
      ctx.fillStyle = '#00e5ff';
      ctx.shadowColor = '#00e5ff';
      ctx.shadowBlur = 15;
      ctx.fillRect(ox - obs.width / 2, obs.y, obs.width, obs.height);
      ctx.shadowBlur = 0;
    }

    // Draw Player Car
    let carScreenX = w / 2 + carX;
    let carScreenY = h - 140;
    ctx.fillStyle = '#ff2d3d';
    ctx.shadowColor = '#ff2d3d';
    ctx.shadowBlur = 20;
    ctx.fillRect(carScreenX - 25, carScreenY, 50, 70);
    // Windshield & details
    ctx.fillStyle = '#fff';
    ctx.fillRect(carScreenX - 18, carScreenY + 15, 36, 20);
    ctx.shadowBlur = 0;
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
updateBank();
</script>
</body>
</html>
