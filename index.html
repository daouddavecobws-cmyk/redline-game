<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>redline.html</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #2c0b4e, #120428);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            color: #ffffff;
            font-size: 26px;
            font-weight: 800;
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff;
        }
        .center-alert {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffff00;
            font-size: 38px;
            font-weight: 900;
            text-shadow: 0 0 20px #ff5500, 0 0 10px #ff0000;
            display: none;
            text-align: center;
        }
        .controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            pointer-events: auto;
            margin-bottom: 10px;
        }
        .btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }
        .btn-nitro {
            width: 110px;
            height: 110px;
            background: rgba(255, 0, 85, 0.7);
            border-color: #ff0055;
            box-shadow: 0 0 25px #ff0055;
            font-size: 24px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="hud">
        <div class="top-bar">
            <div id="speed">70 km/h</div>
            <div id="dist">0 m</div>
            <div id="orbs">💎 0</div>
        </div>
        <div id="alert" class="center-alert">RAMP!</div>
        <div class="controls">
            <div class="btn" id="left">◀</div>
            <div class="btn" id="right">▶</div>
            <div class="btn" id="front">Front</div>
            <div class="btn btn-nitro" id="nitro">Nitro</div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, car, wingsMesh;
        let speed = 70, baseSpeed = 70, dist = 0, orbs = 0;
        let isNitro = false, isAirborne = false, isFlying = false;
        let targetLane = 0, moveLeft = false, moveRight = false;
        let vertVel = 0, carRotX = 0;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0d0221);
            scene.fog = new THREE.FogExp2(0x0d0221, 0.012);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3.8, -7.5);
            camera.lookAt(0, 0.8, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputEncoding = THREE.sRGBEncoding;
            document.body.appendChild(renderer.domElement);

            // Lights for vivid vaporwave look
            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const dirLight = new THREE.DirectionalLight(0xff00ff, 1);
            dirLight.position.set(0, 30, -40);
            scene.add(dirLight);

            // Retro Sun Horizon Element
            const sunMat = new THREE.MeshBasicMaterial({ color: 0xff5500 });
            const sun = new THREE.Mesh(new THREE.CircleGeometry(30, 32), sunMat);
            sun.position.set(0, 18, -250);
            scene.add(sun);

            // Sleek Dark Road with Neon Borders
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x110c1d, roughness: 0.9 });
            const road = new THREE.Mesh(new THREE.PlaneGeometry(10, 1200), roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.z = 600;
            scene.add(road);

            const borderMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
            const leftBorder = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.1, 1200), borderMat);
            leftBorder.position.set(-5, 0.05, 600);
            scene.add(leftBorder);
            const rightBorder = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.1, 1200), borderMat);
            rightBorder.position.set(5, 0.05, 600);
            scene.add(rightBorder);

            // Low-Poly Retro Buildings
            const bldgMat = new THREE.MeshStandardMaterial({ color: 0x05010a, roughness: 0.4 });
            for (let i = 0; i < 50; i++) {
                const h = 30 + Math.random() * 60;
                const bldgGeo = new THREE.BoxGeometry(7, h, 7);
                
                const leftB = new THREE.Mesh(bldgGeo, bldgMat);
                leftB.position.set(-12 - (i % 3) * 3, h / 2, i * 25 - 100);
                scene.add(leftB);

                const rightB = new THREE.Mesh(bldgGeo, bldgMat);
                rightB.position.set(12 + (i % 3) * 3, h / 2, i * 25 - 100);
                scene.add(rightB);
            }

            // High-Contrast Red Sports Car Model
            car = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff0033, metalness: 0.7, roughness: 0.2 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.5, 3.5), bodyMat);
            body.position.y = 0.35;
            car.add(body);

            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.1 });
            const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.4, 1.6), cabinMat);
            cabin.position.set(0, 0.75, -0.2);
            car.add(cabin);

            // Retractable Wings for Sky Ride
            wingsMesh = new THREE.Group();
            const wingMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: false });
            const wingL = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.04, 0.6), wingMat);
            wingL.position.set(-1.8, 0.5, 0);
            const wingR = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.04, 0.6), wingMat);
            wingR.position.set(1.8, 0.5, 0);
            wingsMesh.add(wingL);
            wingsMesh.add(wingR);
            wingsMesh.visible = false;
            car.add(wingsMesh);

            scene.add(car);

            setupInputs();
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function setupInputs() {
            document.getElementById('left').addEventListener('pointerdown', () => moveLeft = true);
            document.getElementById('left').addEventListener('pointerup', () => moveLeft = false);
            document.getElementById('right').addEventListener('pointerdown', () => moveRight = true);
            document.getElementById('right').addEventListener('pointerup', () => moveRight = false);

            const nitroBtn = document.getElementById('nitro');
            nitroBtn.addEventListener('pointerdown', () => { isNitro = true; baseSpeed = 160; });
            nitroBtn.addEventListener('pointerup', () => { isNitro = false; baseSpeed = 70; });

            document.getElementById('front').addEventListener('pointerdown', () => {
                if (isAirborne && !isFlying) {
                    carRotX += Math.PI * 2;
                    showAlert("DOUBLE BACKFLIP + ULTRA AIR!");
                    orbs += 3;
                }
            });
        }

        function showAlert(text) {
            const el = document.getElementById('alert');
            el.innerText = text;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 1800);
        }

        function triggerRamp() {
            if (!isAirborne) {
                isAirborne = true;
                vertVel = 0.28;
                showAlert("MEGA RAMP!");

                if (dist > 1100 && !isFlying) {
                    isFlying = true;
                    wingsMesh.visible = true;
                    showAlert("WINGS! SKY RIDE");
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            speed = THREE.MathUtils.lerp(speed, isNitro ? 160 : baseSpeed, 0.1);
            dist += Math.floor(speed * 0.04);

            if (moveLeft) targetLane = -2.5;
            else if (moveRight) targetLane = 2.5;
            else targetLane = 0;

            car.position.x = THREE.MathUtils.lerp(car.position.x, targetLane, 0.12);

            if (isAirborne) {
                car.position.y += vertVel;
                if (!isFlying) {
                    vertVel -= 0.016;
                    if (car.position.y <= 0) {
                        car.position.y = 0;
                        isAirborne = false;
                        carRotX = 0;
                    }
                } else {
                    car.position.y = THREE.MathUtils.lerp(car.position.y, 7, 0.05);
                    if (dist > 1500) {
                        isFlying = false;
                        wingsMesh.visible = false;
                        isAirborne = false;
                        car.position.y = 0;
                    }
                }
            }

            car.rotation.x = THREE.MathUtils.lerp(car.rotation.x, carRotX, 0.1);

            if (dist % 350 < 10 && !isAirborne) {
                triggerRamp();
            }

            document.getElementById('speed').innerText = `${Math.floor(speed)} km/h`;
            document.getElementById('dist').innerText = `${dist} m`;
            document.getElementById('orbs').innerText = `💎 ${orbs}`;

            camera.position.x = THREE.MathUtils.lerp(camera.position.x, car.position.x * 0.4, 0.1);
            camera.lookAt(car.position.x, car.position.y + 0.8, car.position.z + 4);

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
