<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Redline - Ultimate Arcade Racer</title>
<style>
:root{--ac:#ff2d3d;--pn:rgba(12,10,26,.9);box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#0d071a;color:#fff;font-family:"Avenir Next","Segoe UI",sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{display:none!important}
.ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);pointer-events:none}
.ui>*{pointer-events:auto}
h1{font-size:42px;line-height:1;margin:0;font-style:italic;font-weight:900;letter-spacing:1px;text-shadow:0 3px 0 var(--ac),0 0 20px #ff2d3daa}
.top p{margin:4px 0 8px;opacity:.85;font-size:13px}
.bank{display:inline-block;background:var(--pn);padding:6px 12px;border-radius:10px;font-weight:700;border:1px solid #3a3350}
.row{display:flex;gap:8px;overflow-x:auto;padding:4px 0;margin-bottom:8px}
.card{flex:0 0 auto;min-width:105px;padding:10px;border-radius:12px;background:var(--pn);border:2px solid #3a3350;font-size:11px;line-height:1.3;cursor:pointer}
.card.sel{border-color:var(--ac);background:#251642}
button{font:inherit;color:#fff;border:0;cursor:pointer}
.big{width:100%;padding:14px;font-size:20px;font-weight:900;font-style:italic;background:var(--ac);border-radius:14px;box-shadow:0 4px 0 #a01020;margin-top:6px}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 #a01020}
.btn-secondary{background:#3a3350;box-shadow:0 4px 0 #1e192b}
#over{justify-content:center;align-items:center;background:rgba(10,5,20,0.92);text-align:center;padding:24px}
#over-content{background:var(--pn);padding:24px;border-radius:20px;border:2px solid #3a3350;width:100%;max-width:360px}
#over h2{font-size:32px;margin:0 0 6px;font-style:italic}
#over p{margin:4px 0 10px;font-size:15px}
#unl{color:#00e5ff;font-weight:800}
#hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;justify-content:space-between;padding:0 14px;font-weight:800;text-shadow:0 2px 6px #000;pointer-events:none}
#hud b{font-size:24px;font-style:italic;color:#00e5ff}
#status-msg{position:fixed;top:70px;left:0;right:0;text-align:center;font-weight:900;font-size:20px;font-style:italic;color:#00e5ff;text-shadow:0 0 10px #00e5ff;pointer-events:none;transition:opacity 0.3s}
#race-controls{position:fixed;bottom:25px;left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;pointer-events:none}
.control-btn{width:75px;height:75px;border-radius:50%;background:rgba(255,255,255,0.18);border:2px solid #fff;font-size:24px;font-weight:bold;display:flex;align-items:center;justify-content:center;pointer-events:auto;backdrop-filter:blur(4px)}
.btn-boost{background:var(--ac);border-color:#ff8892}
</style>
</head>
<body>

<canvas id="c"></canvas>

<!-- Live HUD -->
<div id="hud" class="hide">
  <div>SPEED<br><b id="hud-speed">0</b> <small style="font-size:10px">MPH</small></div>
  <div>POWER<br><b id="hud-power" style="color:#00ffcc">READY</b></div>
  <div>DIST<br><b id="hud-dist">3000</b> <small style="font-size:10px">M</small></div>
</div>

<div id="status-msg" class="hide"></div>

<!-- Mobile On-Screen Controls -->
<div id="race-controls" class="hide">
  <div style="display:flex;gap:12px">
    <button class="control-btn" id="btn-left">◀</button>
    <button class="control-btn" id="btn-right">▶</button>
  </div>
  <button class="control-btn btn-boost" id="btn-boost">⚡</button>
</div>

<!-- Garage Screen -->
<div id="menu" class="ui">
  <div class="top">
    <h1>REDLINE</h1>
    <p>6-Lane Highway Racing, Stunts & Traffic.</p>
    <div class="bank">Credits: $<span id="bank-val">600</span></div>
  </div>
  <div>
    <div style="font-weight:800;margin-bottom:6px;font-size:13px">GARAGE UPGRADES</div>
    <div class="row">
      <div class="card" id="card-engine" onclick="buyUpgrade('engine', 150)">
        <b>Engine V8</b><br>+Top Speed<br><span style="color:var(--ac)">$150</span>
      </div>
      <div class="card" id="card-aero" onclick="buyUpgrade('aero', 100)">
        <b>Aero Kit</b><br>+Handling<br><span style="color:var(--ac)">$100</span>
      </div>
      <div class="card" id="card-nitro" onclick="buyUpgrade('nitro', 200)">
        <b>Nitro Boost</b><br>+Duration<br><span style="color:var(--ac)">$200</span>
      </div>
    </div>
    <button class="big" onclick="startRace()">START HIGHWAY RACE</button>
  </div>
</div>

<!-- Game Over / Victory Modal -->
<div id="over" class="ui hide">
  <div id="over-content">
    <h2 id="over-title">RACE FINISHED</h2>
    <p id="over-desc">Great driving!</p>
    <p>Prize Earned: <span id="unl">$0</span></p>
    <button class="big" onclick="startRace()">RACE AGAIN</button>
    <button class="big btn-secondary" onclick="returnToMenu()">BACK TO GARAGE</button>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let w, h;
function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

let gameState = 'menu';
let credits = 600;
let upgrades = { engine: 1, aero: 1, nitro: 1 };
let distance = 0;
let targetDistance = 3000;
let speed = 0;
let baseMaxSpeed = 120;
let carX = 0;
let traffic = [];
let powerups = [];
let roadOffset = 0;
let scenery = [];
let keys = { left: false, right: false, boost: false };
let lastSpawn = 0;
let shieldActive = false;
let stuntMode = null;
let stuntTimer = 0;
let messageTimer = 0;

function updateBank() {
  document.getElementById('bank-val').innerText = credits;
}

function buyUpgrade(type, cost) {
  if (credits >= cost) {
    credits -= cost;
    upgrades[type]++;
    baseMaxSpeed += 15;
    document.getElementById('card-' + type).classList.add('sel');
    updateBank();
  }
}

function showStatus(text) {
  const el = document.getElementById('status-msg');
  el.innerText = text;
  el.classList.remove('hide');
  messageTimer = 1.5;
}

function startRace() {
  document.getElementById('menu').classList.add('hide');
  document.getElementById('over').classList.add('hide');
  document.getElementById('hud').classList.remove('hide');
  document.getElementById('race-controls').classList.remove('hide');
  
  gameState = 'racing';
  distance = 0;
  speed = 50;
  carX = 0;
  traffic = [];
  powerups = [];
  scenery = [];
  roadOffset = 0;
  shieldActive = false;
  stuntMode = null;
  lastSpawn = performance.now();

  for(let i=0; i<15; i++) {
    scenery.push({
      z: i * 200,
      side: i % 2 === 0 ? -1 : 1,
      type: Math.random() > 0.4 ? 'building' : 'tree',
      height: 120 + Math.random() * 200,
      width: 70 + Math.random() * 60,
      color: ['#1e1b4b', '#31103f', '#0f172a'][Math.floor(Math.random()*3)]
    });
  }
}

function endRace(won) {
  gameState = 'over';
  document.getElementById('hud').classList.add('hide');
  document.getElementById('race-controls').classList.add('hide');
  document.getElementById('status-msg').classList.add('hide');
  document.getElementById('over').classList.remove('hide');
  
  const earned = won ? 800 + (upgrades.engine * 100) : 150;
  credits += earned;
  
  document.getElementById('over-title').innerText = won ? 'VICTORY!' : 'CRASHED!';
  document.getElementById('over-desc').innerText = won ? 'You conquered the 6-lane highway!' : 'Your car took too much damage.';
  document.getElementById('unl').innerText = '$' + earned;
  updateBank();
}

function returnToMenu() {
  document.getElementById('over').classList.add('hide');
  document.getElementById('menu').classList.remove('hide');
  gameState = 'menu';
}

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  if (e.key === ' ' || e.key === 'Shift') keys.boost = true;
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
  if (e.key === ' ' || e.key === 'Shift') keys.boost = false;
});

const bindButton = (id, keyName) => {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
  el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
  el.addEventListener('mousedown', () => { keys[keyName] = true; });
  el.addEventListener('mouseup', () => { keys[keyName] = false; });
};
bindButton('btn-left', 'left');
bindButton('btn-right', 'right');
bindButton('btn-boost', 'boost');

function drawCar(x, y, scale, color, isPlayer = false, nitro = false) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);

  const carW = 60;
  const carH = 110;

  ctx.fillStyle = '#0f0f15';
  ctx.fillRect(-carW/2 - 6, -carH/2 + 18, 8, 26);
  ctx.fillRect(carW/2 - 2, -carH/2 + 18, 8, 26);
  ctx.fillRect(-carW/2 - 6, carH/2 - 38, 8, 26);
  ctx.fillRect(carW/2 - 2, carH/2 - 38, 8, 26);

  ctx.fillStyle = color;
  ctx.fillRect(-carW/2, -carH/2, carW, carH);

  ctx.fillStyle = '#111827';
  ctx.fillRect(-carW/2 + 8, -carH/2 + 30, carW - 16, carH - 55);

  ctx.fillStyle = '#38bdf8';
  ctx.fillRect(-carW/2 + 10, -carH/2 + 32, carW - 20, 20);
  ctx.fillRect(-carW/2 + 10, carH/2 - 42, carW - 20, 14);

  if (isPlayer) {
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 12;
    ctx.fillRect(-carW/2 + 4, -carH/2, 10, 5);
    ctx.fillRect(carW/2 - 14, -carH/2, 10, 5);
    
    if (shieldActive) {
      ctx.strokeStyle = '#00e5ff';
      ctx.lineWidth = 4;
      ctx.shadowColor = '#00e5ff';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(0, 0, carW * 0.9, 0, Math.PI * 2);
      ctx.stroke();
    }

    if (nitro) {
      ctx.fillStyle = '#00e5ff';
      ctx.shadowColor = '#00e5ff';
      ctx.shadowBlur = 20;
      ctx.fillRect(-12, carH/2, 24, 30 + Math.random() * 15);
    }
  } else {
    ctx.fillStyle = '#ef4444';
    ctx.shadowColor = '#ef4444';
    ctx.shadowBlur = 10;
    ctx.fillRect(-carW/2 + 4, carH/2 - 4, 10, 5);
    ctx.fillRect(carW/2 - 14, carH/2 - 4, 10, 5);
  }

  ctx.restore();
}

let lastTime = performance.now();
function loop(time) {
  const dt = (time - lastTime) / 1000;
  lastTime = time;

  ctx.clearRect(0, 0, w, h);

  if (messageTimer > 0) {
    messageTimer -= dt;
    if (messageTimer <= 0) document.getElementById('status-msg').classList.add('hide');
  }

  if (gameState === 'racing') {
    let currentMaxSpeed = baseMaxSpeed + (keys.boost ? 60 * upgrades.nitro : 0);
    speed += (currentMaxSpeed - speed) * 0.04;
    distance += speed * dt * 5;

    let handling = 320 + (upgrades.aero * 50);
    if (keys.left) carX -= handling * dt;
    if (keys.right) carX += handling * dt;

    let roadWidth = Math.min(w * 0.85, 520);
    carX = Math.max(-roadWidth/2 + 35, Math.min(roadWidth/2 - 35, carX));

    roadOffset = (roadOffset + speed * dt * 30) % 50;

    if (stuntMode) {
      stuntTimer -= dt;
      if (stuntTimer <= 0) stuntMode = null;
    }

    if (time - lastSpawn > Math.max(900 - (speed * 3), 450)) {
      const laneWidth = roadWidth / 6;
      const lanes = [-roadWidth/2 + laneWidth/2, -roadWidth/2 + laneWidth*1.5, -roadWidth/2 + laneWidth*2.5, -roadWidth/2 + laneWidth*3.5, -roadWidth/2 + laneWidth*4.5, -roadWidth/2 + laneWidth*5.5];
      const selectedLane = lanes[Math.floor(Math.random() * lanes.length)];
      const colors = ['#06b6d4', '#f59e0b', '#8b5cf6', '#10b981', '#ec4899'];
      
      const isPowerup = Math.random() < 0.2;
      const isRamp = !isPowerup && Math.random() < 0.12;

      if (isPowerup) {
        powerups.push({
          x: selectedLane,
          y: -150,
          type: Math.random() > 0.5 ? 'shield' : 'nitro'
        });
      } else if (isRamp) {
        traffic.push({
          x: selectedLane,
          y: -150,
          type: Math.random() > 0.5 ? 'ramp' : 'loop',
          width: 70,
          height: 50
        });
      } else {
        traffic.push({
          x: selectedLane,
          y: -150,
          type: 'car',
          speedFactor: 0.3 + Math.random() * 0.3,
          color: colors[Math.floor(Math.random() * colors.length)],
          width: 55,
          height: 100
        });
      }
      lastSpawn = time;
    }

    for (let s of scenery) {
      s.z -= speed * dt * 3;
      if (s.z < 10) s.z += 3000;
    }

    for (let i = traffic.length - 1; i >= 0; i--) {
      let t = traffic[i];
      t.y += (t.type === 'car' ? (speed * (1 - t.speedFactor)) : speed) * dt * 6;

      let playerX = w / 2 + carX;
      let playerY = h - 160;

      if (Math.abs(playerX - (w/2 + t.x)) < 45 && Math.abs(playerY - t.y) < 60) {
        if (t.type === 'ramp') {
          stuntMode = 'ramp';
          stuntTimer = 2.0;
          showStatus('MEGA JUMP! 🚀');
          traffic.splice(i, 1);
          continue;
        } else if (t.type === 'loop') {
          stuntMode = 'loop';
          stuntTimer = 2.5;
          showStatus('LOOP-DE-LOOP! 🌀');
          traffic.splice(i, 1);
          continue;
        }

        if (shieldActive) {
          shieldActive = false;
          showStatus('SHIELD DEFLECTED CRASH! 🛡️');
          traffic.splice(i, 1);
        } else if (stuntMode) {
          traffic.splice(i, 1);
        } else {
          endRace(false);
        }
      }

      if (t.y > h + 150) traffic.splice(i, 1);
    }

    for (let i = powerups.length - 1; i >= 0; i--) {
      let p = powerups[i];
      p.y += speed * dt * 6;

      let playerX = w / 2 + carX;
      let playerY = h - 160;

      if (Math.abs(playerX - (w/2 + p.x)) < 45 && Math.abs(playerY - p.y) < 50) {
        if (p.type === 'shield') {
          shieldActive = true;
          showStatus('SHIELD ACTIVATED! 🛡️');
        } else {
          keys.boost = true;
          setTimeout(() => keys.boost = false, 3000);
          showStatus('SUPER NITRO BOOST! ⚡');
        }
        powerups.splice(i, 1);
      }

      if (p.y > h + 150) powerups.splice(i, 1);
    }

    if (distance >= targetDistance) endRace(true);

    document.getElementById('hud-speed').innerText = Math.round(speed);
    document.getElementById('hud-power').innerText = shieldActive ? 'SHIELDED' : (stuntMode ? stuntMode.toUpperCase() : 'READY');
    document.getElementById('hud-dist').innerText = Math.max(0, Math.floor(targetDistance - distance));

    ctx.fillStyle = '#080414';
    ctx.fillRect(0, 0, w, h);

    let cx = w / 2;

    for (let s of scenery) {
      let scale = 200 / s.z;
      let sx = cx + s.side * (roadWidth/2 + 80 * scale + 100);
      let sy = h/2 + 50 * scale;

      if (s.type === 'building') {
        ctx.fillStyle = s.color;
        ctx.fillRect(sx - (s.width*scale)/2, sy - (s.height*scale), s.width*scale, s.height*scale);
        ctx.fillStyle = '#fbbf24';
        for(let wx=sx - s.width*scale*0.3; wx<sx + s.width*scale*0.3; wx+=12*scale) {
          for(let wy=sy - s.height*scale*0.9; wy<sy - 20*scale; wy+=20*scale) {
            ctx.fillRect(wx, wy, 6*scale, 10*scale);
          }
        }
      } else {
        ctx.fillStyle = '#065f46';
        ctx.beginPath();
        ctx.arc(sx, sy - 40*scale, 25*scale, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#78350f';
        ctx.fillRect(sx - 5*scale, sy - 20*scale, 10*scale, 25*scale);
      }
    }

    ctx.fillStyle = '#140c26';
    ctx.fillRect(cx - roadWidth/2, 0, roadWidth, h);

    ctx.fillStyle = '#ff2d3d';
    ctx.fillRect(cx - roadWidth/2 - 8, 0, 8, h);
    ctx.fillRect(cx + roadWidth/2, 0, 8, h);

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
    ctx.lineWidth = 2;
    ctx.setLineDash([25, 25]);
    ctx.lineDashOffset = -roadOffset;

    let laneW = roadWidth / 6;
    for (let l = 1; l <= 5; l++) {
      ctx.beginPath();
      ctx.moveTo(cx - roadWidth/2 + laneW * l, 0);
      ctx.lineTo(cx - roadWidth/2 + laneW * l, h);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    for (let t of traffic) {
      if (t.type === 'car') {
        drawCar(cx + t.x, t.y, 1.0, t.color, false);
      } else if (t.type === 'ramp') {
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(cx + t.x - 35, t.y, 70, 40);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px sans-serif';
        ctx.fillText('RAMP', cx + t.x - 20, t.y + 25);
      } else if (t.type === 'loop') {
        ctx.strokeStyle = '#00e5ff';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(cx + t.x, t.y + 25, 30, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    for (let p of powerups) {
      ctx.fillStyle = p.type === 'shield' ? '#00e5ff' : '#ff2d3d';
      ctx.shadowColor = ctx.fillStyle;
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(cx + p.x, p.y, 20, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText(p.type === 'shield' ? '🛡️' : '⚡', cx + p.x - 8, p.y + 5);
    }

    let playerScale = stuntMode === 'ramp' ? 1.4 : (stuntMode === 'loop' ? 0.7 : 1.0);
    drawCar(cx + carX, h - 160, playerScale, '#ff2d3d', true, keys.boost);
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
updateBank();
</script>
</body>
</html>
